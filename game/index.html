<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星织 Asterweave · 10 关</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:#05070f}
  body{
    color:#e8eefc;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
    min-height:100vh;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    /* 深蓝紫夜空：多层星云径向渐变 + 竖向底色（纯 CSS，无图片） */
    background:
      radial-gradient(1100px 780px at 82% -12%, rgba(96,74,190,.42), rgba(96,74,190,0) 62%),
      radial-gradient(900px 700px at 8% 2%, rgba(38,118,190,.30), rgba(38,118,190,0) 60%),
      radial-gradient(820px 620px at 52% 112%, rgba(126,60,168,.30), rgba(126,60,168,0) 62%),
      linear-gradient(180deg,#05070f 0%,#080d1e 42%,#0b1130 78%,#0a0f26 100%);
    background-repeat:no-repeat;
  }
  /* 静态星点层：多层 radial-gradient 平铺（无动画，省电；无图片/外链） */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.3px 1.3px at 18px 26px, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
      radial-gradient(1px 1px at 74px 92px, rgba(200,225,255,.85), rgba(200,225,255,0) 60%),
      radial-gradient(1.6px 1.6px at 132px 48px, rgba(255,245,225,.9), rgba(255,245,225,0) 60%),
      radial-gradient(1px 1px at 42px 148px, rgba(190,205,255,.7), rgba(190,205,255,0) 60%),
      radial-gradient(1.4px 1.4px at 168px 178px, rgba(255,255,255,.8), rgba(255,255,255,0) 60%),
      radial-gradient(1px 1px at 200px 110px, rgba(170,200,255,.65), rgba(170,200,255,0) 60%);
    background-size:220px 220px,260px 260px,300px 300px,180px 180px,340px 340px,240px 240px;
    background-repeat:repeat;
    opacity:.85;
  }
  .app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px 8px 28px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px;flex-wrap:wrap}
  .title{font-size:17px;font-weight:800;letter-spacing:.02em;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .title .who{font-size:13px;font-weight:600;color:#8fa0b8;margin-left:6px}
  .meta{font-size:12px;color:#7f8ea6;padding:0 2px 8px;font-variant-numeric:tabular-nums}

  .lvbtn{
    min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #2b3444;
    background:#161c26;color:#c3d0e2;font:inherit;font-size:13px;font-weight:800;
    cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .lvbtn b{color:#8fc3ff;font-variant-numeric:tabular-nums}
  .lvbtn[aria-expanded="true"]{background:#1f3a63;border-color:#4b7fbd;color:#e4f0ff}

  .panel{
    display:none;margin:0 2px 10px;padding:10px;border-radius:12px;
    background:#141a23;border:1px solid #263042;
  }
  /* 关卡 = 右侧抽屉（不再把页面顶下去） */
  .panel.lvdrawer{
    position:fixed;top:0;right:0;bottom:0;left:auto;z-index:45;
    width:min(360px,88vw);margin:0;border-radius:0;border:0;border-left:1px solid #263042;
    background:linear-gradient(180deg,#151c27,#0e131b);
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;
    transform:translateX(100%);transition:transform .24s cubic-bezier(.22,.8,.3,1);
    box-shadow:-18px 0 40px rgba(0,0,0,.45);
  }
  .panel.lvdrawer.open{display:block;transform:none}
  .panel.lvdrawer[hidden]{display:none}
  .drawer-mask{position:fixed;inset:0;z-index:44;background:rgba(3,6,14,.64);
    opacity:0;pointer-events:none;transition:opacity .24s ease}
  .drawer-mask.open{opacity:1;pointer-events:auto}
  body.drawer-open{overflow:hidden}
  .lvdrawer .lvgrid{gap:8px}
  .lvdrawer .panel-head{position:sticky;top:-14px;background:linear-gradient(180deg,#151c27 70%,rgba(21,28,39,0));padding:6px 0 10px;margin-bottom:4px}
  @media (prefers-reduced-motion: reduce){
    .panel.lvdrawer,.drawer-mask{transition:none}
  }
  .panel.open{display:block}
  .panel[hidden]{display:none}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .panel-title{font-size:13px;font-weight:800;color:#b9c8dc}
  .panel-title b{color:#8fc3ff;font-variant-numeric:tabular-nums}
  .mini{
    min-height:44px;padding:0 10px;border-radius:9px;border:1px solid #2b3444;
    background:#121821;color:#9fb0c6;font:inherit;font-size:12px;font-weight:700;
    cursor:pointer;touch-action:manipulation;
  }
  .mini.danger{background:#2a1418;border-color:#7a2333;color:#ff9aab}

  .lvgrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
    gap:6px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:2px;
  }
  .lvl{
    position:relative;min-height:52px;border-radius:10px;border:1px solid #2b3444;
    background:#161c26;color:#a9b8cd;font:inherit;font-size:14px;font-weight:800;
    cursor:pointer;touch-action:manipulation;
  }
  .lvl.cleared{background:#14301f;border-color:#2f6b46;color:#8ff0b4}
  .lvl.cleared::after{content:"✓";position:absolute;top:2px;right:6px;font-size:10px;color:#5fd08a}
  .lvl.current{background:#1f3a63;border-color:#4b7fbd;color:#eaf3ff;box-shadow:0 0 0 2px rgba(75,127,189,.3)}
  .lvl.locked{background:#101419;border-color:#1f2734;color:#59647a;cursor:not-allowed}
  .lvl.locked::after{content:"🔒";position:absolute;top:2px;right:5px;font-size:10px;opacity:.85}
  .lvl.playing{outline:2px dashed #ffd166;outline-offset:2px}
  .mini.on{background:#1d3550;border-color:#4b7fbd;color:#dbeaff}
  .panel-hint{margin-top:8px;font-size:11px;color:#6f7f96;line-height:1.5}

  .status{
    margin:0 2px 8px;padding:9px 10px;border-radius:10px;
    background:#151b24;border:1px solid #232c3a;
    font-size:14px;font-weight:700;color:#cbd8ea;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;
  }
  .status .stat-counts{flex:1 1 auto;min-width:0}

  /* 三架望远镜 = 命数：固定槽位宽度，熄灭/受击都不改变状态栏尺寸 */
  .scopes{
    display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;
    min-width:calc(3 * 1.28em);            /* 3 个的固定宽度，布局不跳动 */
    line-height:1;font-size:1.05em;
  }
  .scopes .scope{
    display:inline-flex;align-items:center;justify-content:center;
    width:1.28em;height:1.28em;
    transition:color .18s ease, opacity .18s ease, transform .18s ease;
  }
  .scope-svg{width:100%;height:100%;display:block;overflow:visible}
  .scope-tube{fill:currentColor;fill-opacity:.20;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
  .scope-lens,.scope-leg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
  .scopes .scope.full{color:#9adbff;filter:drop-shadow(0 0 5px rgba(120,196,255,.55))}
  .scopes .scope.empty{color:#3a4459;opacity:.5;filter:none}
  .scopes.flash .scope{animation:scopeHit .22s ease}
  @keyframes scopeHit{50%{transform:scale(1.22)}}
  @media (prefers-reduced-motion: reduce){
    .scopes.flash .scope{animation:none}
  }

  .teach{
    margin:0 2px 10px;padding:9px 10px;border-radius:10px;
    background:#182333;border:1px solid #2b3f5c;color:#bcd3ef;
    font-size:13px;line-height:1.5;
  }
  .teach.hidden{display:none}

  .boardwrap{display:flex;justify-content:center}
  /* 棋盘 = 观测窗：半透明夜空 + 细边框 + 内发光 */
  .board{
    --cols:6;--fs:18px;
    display:grid;
    grid-template-columns:repeat(var(--cols),1fr);
    align-items:start;
    gap:3px;
    width:100%;max-width:520px;
    padding:6px;border-radius:16px;
    background:linear-gradient(180deg, rgba(16,24,52,.74), rgba(7,11,26,.86));
    border:1px solid rgba(122,160,230,.26);
    box-shadow:inset 0 0 34px rgba(86,126,220,.16), 0 14px 40px rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    user-select:none;-webkit-user-select:none;
  }
  .cell{
    appearance:none;-webkit-appearance:none;
    display:flex;align-items:center;justify-content:center;
    aspect-ratio:1/1;width:100%;
    padding:0;margin:0;border-radius:8px;
    border:1px solid rgba(124,158,224,.26);
    background:linear-gradient(180deg, rgba(36,50,92,.86), rgba(15,21,45,.92));
    color:#eaf1ff;font-family:inherit;font-weight:800;line-height:1;
    font-size:var(--fs);
    cursor:pointer;touch-action:manipulation;
    box-shadow:inset 0 1px 0 rgba(180,210,255,.08);
    transition:background .12s ease, border-color .12s ease;
  }
  .cell:active{transform:scale(.96)}
  .cell.revealed{
    position:relative;
    background:rgba(4,7,18,.74);
    border-color:rgba(90,120,180,.18);
    cursor:default;transform:none;
    box-shadow:inset 0 0 12px rgba(60,100,180,.10);
    /* 数字：等宽 + 星等质感（字号仍由 --fs 自适应） */
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums;
  }
  /* 极细刻度环：只做装饰，绝对定位不占位、不影响字号自适应 */
  .cell.revealed.tick::after{
    content:"";position:absolute;inset:15%;border-radius:50%;
    border:1px solid currentColor;opacity:.13;pointer-events:none;
  }
  .cell.n0{color:#4d5c7a}
  .cell.n1{color:#7cc0ff;text-shadow:0 0 7px rgba(124,192,255,.52),0 0 16px rgba(124,192,255,.20)}
  .cell.n2{color:#6ee7b0;text-shadow:0 0 7px rgba(110,231,176,.45),0 0 16px rgba(110,231,176,.18)}
  .cell.n3{color:#ff9a9a;text-shadow:0 0 7px rgba(255,154,154,.5),0 0 16px rgba(255,154,154,.18)}
  .cell.n4{color:#c9a6ff;text-shadow:0 0 7px rgba(201,166,255,.5),0 0 16px rgba(201,166,255,.18)}
  .cell.n5{color:#ffcf7a;text-shadow:0 0 7px rgba(255,207,122,.5),0 0 16px rgba(255,207,122,.18)}
  .cell.n6{color:#74e4e4;text-shadow:0 0 7px rgba(116,228,228,.45),0 0 16px rgba(116,228,228,.16)}
  .cell.n7{color:#ffaede;text-shadow:0 0 7px rgba(255,174,222,.5),0 0 16px rgba(255,174,222,.18)}
  .cell.n8{color:#d7e2f5;text-shadow:0 0 7px rgba(215,226,245,.45),0 0 16px rgba(215,226,245,.16)}
  /* 插旗 = 玩家标记的星（暖金 ★），与踩爆的星区分 */
  .cell.flagged{
    background:linear-gradient(180deg,rgba(54,46,92,.92),rgba(26,22,50,.94));
    border-color:rgba(150,120,220,.55);color:#ffd166;
    text-shadow:0 0 8px rgba(255,209,102,.5);
  }
  /* 踩到未标记的星：亮起 + 轻微抖动 */
  .cell.hitstar{
    background:radial-gradient(circle at 50% 45%, rgba(130,190,255,.40), rgba(28,12,30,.94) 72%);
    border-color:rgba(160,200,255,.65);color:#ffffff;
    text-shadow:0 0 10px #9ad0ff,0 0 22px #6fb3f0;
    animation:starHit .42s ease;
  }
  /* 踩到杂星：冷灰内联 SVG 四角星，明显更暗、无光晕、更小（一眼区分；SVG 避免字体回退方框） */
  .cell.hitnoise{
    background:radial-gradient(circle at 50% 45%, rgba(122,138,168,.20), rgba(8,10,18,.95) 74%);
    border-color:rgba(132,148,178,.42);color:#aab6c9;
    animation:starHit .42s ease;
  }
  /* 杂星图形（内联 SVG 四角星）：尺寸交给宽度百分比，冷灰走 currentColor */
  .cell .noise-star{width:64%;height:64%;display:block;fill:currentColor;opacity:.92}
  @keyframes starHit{0%{transform:scale(1.26)}62%{transform:scale(.95)}100%{transform:scale(1)}}
  /* 通关揭晓：星座星点亮为亮白 ✦ */
  .cell.wonstar{
    background:linear-gradient(180deg,rgba(22,34,64,.92),rgba(11,17,40,.94));
    border-color:rgba(110,150,220,.5);color:#e2eeff;
    text-shadow:0 0 9px #9ad0ff,0 0 20px rgba(111,179,240,.6);
  }
  /* 通关揭晓：杂星只留暗灰四角星，不参与星座 */
  .cell.wonoise{
    background:linear-gradient(180deg,rgba(16,19,30,.94),rgba(8,10,18,.96));
    border-color:rgba(96,108,132,.30);color:#6c7891;
    text-shadow:none;opacity:.82;
  }
  .cell.wonoise .noise-star{opacity:.72}
  @media (prefers-reduced-motion: reduce){
    .cell.hitstar,.cell.hitnoise{animation:none}
    .cell{transition:none}
  }

  .clue{
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--fs)*.52);font-weight:800;color:#8fa7c8;
    line-height:1.15;min-width:0;min-height:0;overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  .clue-col{flex-direction:column;justify-content:flex-end;gap:1px}
  .clue-row{flex-direction:row;justify-content:flex-end;gap:4px}
  .clue-corner{visibility:hidden}

  .actions{display:flex;gap:8px;margin:14px 2px 0;flex-wrap:wrap}
  .actions.split{justify-content:space-between}
  .btn{
    flex:1 1 0;min-height:48px;min-width:96px;padding:0 12px;
    border-radius:12px;border:1px solid #2b3444;background:#161c26;color:#c3d0e2;
    font:inherit;font-size:14px;font-weight:800;cursor:pointer;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.98)}
  .btn.on{background:#1f3a63;border-color:#4b7fbd;color:#e4f0ff;box-shadow:0 0 0 1px #4b7fbd inset}
  .btn.primary{background:#28623f;border-color:#3f9c66;color:#e6fff0}
  .btn.ghost{background:#121821;color:#9fb0c6}

  .result{
    margin:12px 2px 0;padding:12px;border-radius:12px;display:none;
    border:1px solid #2b3444;background:#141a23;
  }
  .result.show{display:block}
  .result.win{background:#14251c;border-color:#2f6b46}
  .result.lose{background:#2a1418;border-color:#7a2333}
  .result .msg{font-size:14px;font-weight:800}
  .result.win .msg{color:#8ff0b4}
  .result.lose .msg{color:#ff9aab}
  .result .result-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .result .result-btns .btn{min-height:44px}

  /* 结算 modal：遮罩 + 卡片（竖直居中，竖屏自适应） */
  .overlay{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(6,9,14,.72);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .16s ease, visibility .16s ease;
  }
  .overlay.open{opacity:1;visibility:visible;pointer-events:auto}
  .modal{
    width:min(92vw,420px);max-height:82vh;overflow:auto;
    padding:20px 18px 18px;border-radius:16px;
    background:#161d29;border:1px solid #33405a;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    transform:translateY(6px) scale(.985);
    transition:transform .16s ease;
    text-align:center;
  }
  .overlay.open .modal{transform:none}
  .modal:focus{outline:none}
  .modal-title{margin:0 0 6px;font-size:19px;font-weight:800;color:#eaf1fb;line-height:1.35}
  .modal-sub{margin:0 0 16px;font-size:13px;line-height:1.6;color:#9fb0c6}
  .modal.win .modal-title{color:#8ff0b4}
  .modal.lose .modal-title{color:#ff9aab}
  .modal-btns{display:flex;flex-direction:column;gap:10px}
  .modal-btns .btn{width:100%;min-height:48px;flex:none}
  .modal-btns .btn.primary{background:#28623f;border-color:#3f9c66;color:#e6fff0}
  .modal-btns .btn.again{background:#1f3a63;border-color:#4b7fbd;color:#e4f0ff}
  .modal-btns .btn:disabled{opacity:.45;cursor:default}
  @media (prefers-reduced-motion: reduce){
    .overlay,.modal{transition:none}
  }

  /* ===== 通关揭晓：深空照片感（相框 + 视星等星点 + 连线；≤0.8s 曝光渐亮） ===== */
  .const-slot:empty{display:none}
  .const-panel{margin:2px auto 14px;width:100%;text-align:center}
  .const-name{font-size:16px;font-weight:800;color:#eaf2ff;letter-spacing:.02em}
  .const-name span{font-size:11px;font-weight:600;color:#8fa6c6;margin-left:6px;letter-spacing:0}
  /* 深空相框：径向夜空 + 两层极淡星云 + 暗角 + 极淡银河斜带（纯 CSS） */
  .const-map{position:relative;margin:8px auto 2px;width:100%;max-width:250px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(120,150,210,.22);
    background:radial-gradient(72% 58% at 24% 20%,rgba(92,70,150,.22),rgba(92,70,150,0) 70%),radial-gradient(78% 62% at 80% 76%,rgba(122,62,104,.16),rgba(122,62,104,0) 72%),radial-gradient(120% 92% at 50% 38%,rgba(56,84,148,.28),rgba(6,9,20,0) 64%),radial-gradient(circle at 50% 46%,#0a1124 0%,#05070f 66%,#02030a 100%);
    box-shadow:inset 0 0 46px rgba(0,0,0,.92),0 8px 22px rgba(0,0,0,.42)}
  .const-map::before{content:"";position:absolute;left:-30%;top:33%;width:160%;height:26%;transform:rotate(-20deg);pointer-events:none;
    background:linear-gradient(90deg,rgba(150,180,255,0),rgba(150,180,255,.07) 34%,rgba(200,170,255,.06) 62%,rgba(150,180,255,0));filter:blur(6px)}
  .const-map::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(circle at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.66) 100%)}
  .const-svg{position:relative;z-index:1;width:100%;height:auto;display:block;overflow:visible;animation:constExposure .7s ease-out both}
  .const-svg .gdust{fill:#cfe0ff}
  .const-svg .gnoise{fill:#8b98ad;stroke:none;opacity:.5;animation:constNoiseFade 1.5s ease forwards}
  @keyframes constNoiseFade{0%{opacity:0}22%{opacity:.55}55%{opacity:.42}100%{opacity:.12}}
  .const-svg .gline-glow{stroke:#7fb0ff;stroke-width:2.4;stroke-linecap:round;stroke-opacity:.1}
  .const-svg .gline{stroke:#8ab4ff;stroke-width:.6;stroke-linecap:round;stroke-opacity:.45;stroke-dasharray:200;stroke-dashoffset:200;animation:constDraw .32s ease forwards}
  .const-svg .ghalo,.const-svg .ghalo2,.const-svg .gstar,.const-svg .gspike{opacity:0;animation:constPop .3s ease forwards}
  .const-fact{margin:8px 2px 0;font-size:12px;line-height:1.55;color:#9fb4d0;text-align:center}
  .const-tag{display:inline-block;margin-top:9px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;color:#08111f;background:linear-gradient(180deg,#a9d8ff,#6fb3f0)}
  @keyframes constDraw{to{stroke-dashoffset:0}}
  @keyframes constPop{to{opacity:1}}
  @keyframes constExposure{0%{opacity:0;filter:brightness(.35)}60%{opacity:1;filter:brightness(1.18)}100%{opacity:1;filter:brightness(1)}}
  @media (prefers-reduced-motion:reduce){
    .const-svg{animation:none;opacity:1;filter:none}
    .const-svg .gline{animation:none;stroke-dashoffset:0}
    .const-svg .ghalo,.const-svg .ghalo2,.const-svg .gstar,.const-svg .gspike{animation:none;opacity:1}
    .const-svg .gnoise{animation:none;opacity:.14}
    .const-map::before{filter:none}
  }

  /* 通关：星座点亮后整体闪一下（再弹结算弹窗） */
  .board.reveal-flash .cell.wonstar{animation:winStarFlash .85s ease-out both}
  .board.reveal-flash .cell.wonoise{animation:winStarFlashDim .85s ease-out both}
  @keyframes winStarFlash{0%{filter:none;transform:scale(1)}
    30%{filter:brightness(2.5) drop-shadow(0 0 7px #9ad0ff);transform:scale(1.13)}
    60%{filter:brightness(1.5) drop-shadow(0 0 4px #9ad0ff);transform:scale(1.04)}
    100%{filter:none;transform:scale(1)}}
  @keyframes winStarFlashDim{0%,100%{opacity:.9}50%{opacity:.45}}
  @media (prefers-reduced-motion: reduce){

const boardEl = document.getElementById('board');

const MODE_DIG = 'dig';
const MODE_FLAG = 'flag';

let currentMode = MODE_DIG;
let S = null;          // 当前关卡的全部状态
let cellEls = [];      // 索引 -> 格子元素
let lvlEls = [];       // 关卡面板按钮
let panelOpen = false;
let resetArmed = false;

// 结算 modal 状态
let modalDismissed = false;  // 按 Esc / 点遮罩收起后，改由底部结算条保留入口
let modalOpenNow = false;
let modalSignature = '';     // 内容未变就不重建，避免每次 render 抢焦点
let winFlashPending = false; // 通关：先在棋盘上点亮星座并闪一下，再弹结算弹窗
let modalPrimaryBtn = null;  // 打开时把焦点放到主按钮
let lastFocusEl = null;
let lastShownLives = -1;     // 用于爱心受击动画
let flashTimer = null;
let flashing = false;

// ---------- 进度记忆：localStorage 不可用时静默降级为内存进度，绝不弹错 ----------
const STORAGE_KEY = 'leixian.migong.progress.v1';
let progress = { v: 1, cleared: {}, last: 0, devUnlock: false };
let storageOK = true;

function loadProgress(){
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return;
    const cleared = {};
    if (saved.cleared && typeof saved.cleared === 'object'){
      for (const key in saved.cleared){
        if (Object.prototype.hasOwnProperty.call(saved.cleared, key) && saved.cleared[key]){
          cleared[String(key)] = 1;
        }
      }
    }
    progress = {
      v: 1,
      cleared: cleared,
      last: (typeof saved.last === 'number' && saved.last >= 0) ? Math.floor(saved.last) : 0,
      devUnlock: saved.devUnlock === true
    };
  } catch (e) {
    storageOK = false;          // 本地文件或隐私模式下存储被禁用：静默降级
  }
}

function saveProgress(){
  if (!storageOK) return;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    storageOK = false;          // 写失败也不打断游戏
  }
}

function isCleared(i){ return !!progress.cleared[String(i)]; }

// 已通关连续段之后的第一个未通关关卡 = 当前关卡；全部通关则返回 LEVELS.length
function frontier(){
  const total = LEVELS.length;
  for (let i = 0; i < total; i++) if (!isCleared(i)) return i;
  return total;
}

function isUnlocked(i){ return progress.devUnlock === true || i <= frontier(); }

function clearedTotal(){
  let k = 0;
  for (let i = 0; i < LEVELS.length; i++) if (isCleared(i)) k++;
  return k;
}

function markCleared(i){
  if (isCleared(i)) return;
  progress.cleared[String(i)] = 1;
  progress.last = i;
  saveProgress();
  refreshLevelGrid();
  refreshUnlockBtn();
  refreshSkyBadge();
}

function startIndex(){
  const total = LEVELS.length;
  if (total === 0) return 0;
  const f = frontier();
  if (f >= total) return total - 1;    // 全部通关：停在最后一关，方便重玩
  return f;
}

function clampIndex(i){
  const total = Array.isArray(LEVELS) ? LEVELS.length : 0;
  if (total === 0) return 0;
  if (typeof i !== 'number' || isNaN(i) || i < 0) return 0;
  return i > total - 1 ? total - 1 : i;
}

function runsFromMines(mineSet, n, byRow, k){
  const runs = [];
  let cur = 0;
  for (let t = 0; t < n; t++){
    const i = byRow ? (k * n + t) : (t * n + k);
    if (mineSet.has(i)) cur++;
    else { if (cur > 0) runs.push(cur); cur = 0; }
  }
  if (cur > 0) runs.push(cur);
  return runs;
}

function startLevel(rawIndex){
  if (!Array.isArray(LEVELS) || LEVELS.length === 0){
    boardEl.innerHTML = '<p class="err">关卡数据缺失。</p>';
    return;
  }
  const index = clampIndex(rawIndex);
  const level = LEVELS[index];
  const n = level.size;
  const mineSet = new Set();
  const mines = Array.isArray(level.mines) ? level.mines : [];
  for (let m = 0; m < mines.length; m++){
    const cell = mines[m];
    if (!cell || cell.length < 2) continue;
    const r = cell[0], c = cell[1];
    if (r >= 0 && c >= 0 && r < n && c < n) mineSet.add(r * n + c);
  }

  // 杂星（不属于星座的雷）：只用于「图标区分/是否参与揭晓」。
  // 数据约定 mines 已含杂星；这里再把 noise 并进雷集，避免数据漏写导致杂星能踩穿。
  const noiseSet = new Set();
  const noise = Array.isArray(level.noise) ? level.noise : [];
  for (let m = 0; m < noise.length; m++){
    const cell = noise[m];
    if (!cell || cell.length < 2) continue;
    const r = cell[0], c = cell[1];
    if (r >= 0 && c >= 0 && r < n && c < n){
      const ni = r * n + c;
      noiseSet.add(ni);
      mineSet.add(ni);
    }
  }

  const total = n * n;
  const nbrs = new Array(total);
  const counts = new Int16Array(total);
  for (let i = 0; i < total; i++){
    const r = Math.floor(i / n), c = i % n, list = [];
    for (let dr = -1; dr <= 1; dr++){
      for (let dc = -1; dc <= 1; dc++){
        if (dr === 0 && dc === 0) continue;
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
        list.push(rr * n + cc);
      }
    }
    nbrs[i] = list;
    let k = 0;
    for (let j = 0; j < list.length; j++) if (mineSet.has(list[j])) k++;
    counts[i] = k;
  }

  // 线索优先用关卡数据；缺字段时按 mines 现算（只展示线索本身，不展示 mines）。
  const rowRuns = new Array(n), colRuns = new Array(n);
  for (let r = 0; r < n; r++){
    rowRuns[r] = (Array.isArray(level.rowRuns) && Array.isArray(level.rowRuns[r]))
      ? level.rowRuns[r] : runsFromMines(mineSet, n, true, r);
  }
  for (let c = 0; c < n; c++){
    colRuns[c] = (Array.isArray(level.colRuns) && Array.isArray(level.colRuns[c]))
      ? level.colRuns[c] : runsFromMines(mineSet, n, false, c);
  }

  const lives = (typeof level.lives === 'number' && level.lives > 0) ? Math.floor(level.lives) : 3;

  S = {
    index: index,
    level: level,
    n: n,
    mineSet: mineSet,
    noiseSet: noiseSet,
    lastHitNoise: false,
    nbrs: nbrs,
    counts: counts,
    rowRuns: rowRuns,
    colRuns: colRuns,
    lives: lives,
    livesMax: lives,
    totalSafe: total - mineSet.size,
    revealedSafe: new Uint8Array(total),
    revealedMine: new Uint8Array(total),
    flagged: new Uint8Array(total),
    status: 'playing'
  };

  modalDismissed = false;
  modalSignature = '';
  lastShownLives = -1;
  flashing = false;
  scopesEl.className = 'scopes';
  progress.last = index;
  saveProgress();

  buildBoard();

  // 开局赠送：opening 是 0 格，自动 flood fill。
  const op = Array.isArray(level.opening) ? level.opening : null;
  if (op && op.length >= 2){
    const oi = op[0] * n + op[1];
    if (oi >= 0 && oi < total && !mineSet.has(oi)) floodReveal(oi);
  }
  checkWin();
  render();
}

function buildBoard(){
  const n = S.n;
  const withRuns = !!S.level.showRuns;
  const cols = n + (withRuns ? 1 : 0);
  boardEl.style.setProperty('--cols', String(cols));
  boardEl.innerHTML = '';
  cellEls = new Array(n * n);

  const frag = document.createDocumentFragment();
  if (withRuns){
    frag.appendChild(clueEl('clue clue-corner', null));
    for (let c = 0; c < n; c++) frag.appendChild(clueEl('clue clue-col', S.colRuns[c]));
  }
  for (let r = 0; r < n; r++){
    if (withRuns) frag.appendChild(clueEl('clue clue-row', S.rowRuns[r]));
    for (let c = 0; c < n; c++){
      const i = r * n + c;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.setAttribute('data-i', String(i));
      b.setAttribute('data-r', String(r));
      b.setAttribute('data-c', String(c));
      b.setAttribute('aria-label', '第' + (r + 1) + '行 第' + (c + 1) + '列');
      cellEls[i] = b;
      frag.appendChild(b);
    }
  }
  boardEl.appendChild(frag);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fitBoard);
  else fitBoard();
}

function clueEl(cls, runs){
  const d = document.createElement('div');
  d.className = cls;
  if (!runs) return d;
  const list = runs.length ? runs : [0];   // 无雷的行/列显示 0
  for (let k = 0; k < list.length; k++){
    const s = document.createElement('span');
    s.textContent = String(list[k]);
    d.appendChild(s);
  }
  return d;
}

// 棋盘随容器宽度自适应：用实测格子宽度推字号，保证不横向溢出。
function fitBoard(){
  const first = cellEls[0];
  if (!first) return;
  const w = first.getBoundingClientRect().width;
  if (w > 0) boardEl.style.setProperty('--fs', (w * 0.5).toFixed(2) + 'px');
}
window.addEventListener('resize', function(){ if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fitBoard); else fitBoard(); });
window.addEventListener('orientationchange', function(){ setTimeout(fitBoard, 150); });

function floodReveal(start){
  const n = S.n;
  const stack = [start];
  while (stack.length){
    const i = stack.pop();
    if (S.revealedSafe[i] || S.revealedMine[i] || S.flagged[i]) continue;
    if (S.mineSet.has(i)) continue;
    S.revealedSafe[i] = 1;
    if (S.counts[i] === 0){
      const list = S.nbrs[i];
      for (let k = 0; k < list.length; k++){
        const j = list[k];
        if (S.revealedSafe[j] || S.revealedMine[j] || S.flagged[j]) continue;
        if (S.mineSet.has(j)) continue;
        stack.push(j);
      }
    }
  }
}

function checkWin(){
  if (!S || S.status !== 'playing') return;
  const total = S.n * S.n;
  for (let i = 0; i < total; i++){
    if (S.mineSet.has(i)){
      if (!S.flagged[i] && !S.revealedMine[i]) return;  // 所有雷必须已标出
    } else if (!S.revealedSafe[i]){
      return;                                          // 所有安全格必须已翻开
    }
  }
  S.status = 'won';
  markCleared(S.index);
  // 通关小细节：星座在棋盘上点亮并闪一下，再弹结算弹窗（reduced-motion 下直接弹）
  winFlashPending = true;
  if (boardEl) boardEl.classList.add('reveal-flash');
  const reduce = (typeof window.matchMedia === 'function') &&
                 window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){
    if (boardEl) boardEl.classList.remove('reveal-flash');
    winFlashPending = false;
    render();
  }, reduce ? 120 : 900);
}

function act(i, mode){
  if (!S || S.status !== 'playing') return;
  if (S.revealedSafe[i] || S.revealedMine[i]) return;
  if (mode === MODE_FLAG){
    S.flagged[i] = S.flagged[i] ? 0 : 1;   // 插旗可取消
    checkWin();
    render();
    return;
  }
  if (S.flagged[i]) return;                // 探格模式下不会误翻开已插旗的格
  if (S.mineSet.has(i)){
    S.revealedMine[i] = 1;                 // 踩雷：扣 1 命并标记该雷
    S.lastHitNoise = !!S.noiseSet.has(i);  // 只记录“踩到的这一颗”是不是杂星（不泄露其它）
    S.lives -= 1;
    if (S.lives <= 0){ S.lives = 0; S.status = 'lost'; render(); return; }
    checkWin();
    render();
    return;
  }
  floodReveal(i);
  checkWin();
  render();
}

function setMode(m){
  currentMode = m;
  render();
}

function render(){
  if (!S) return;
  const total = S.n * S.n;
  let revealed = 0, flags = 0, blasted = 0;
  for (let i = 0; i < total; i++){
    if (S.revealedSafe[i]) revealed++;
    if (S.flagged[i]) flags++;
    if (S.revealedMine[i]) blasted++;
  }
  const marked = flags + blasted;          // 踩爆的雷也算“已标记”
  const minesTotal = S.mineSet.size;

  for (let i = 0; i < total; i++){
    const el = cellEls[i];
    if (!el) continue;
    let cls = 'cell';
    let text = '';
    let svg = '';                          // 杂星用内联 SVG，避免 ✧ 在某些安卓字体里变方框
    if (S.revealedSafe[i]){
      const v = S.counts[i];
      cls += ' revealed n' + v + (v > 0 ? ' tick' : '');
      text = v === 0 ? '' : String(v);
    } else if (S.revealedMine[i]){
      // 踩爆：星座星 = 亮白 ✦ + 光晕；杂星 = 冷灰四角星（一眼区分）
      if (S.noiseSet.has(i)){ cls += ' revealed hitnoise'; svg = NOISE_STAR_SVG; }
      else { cls += ' revealed hitstar'; text = '✦'; }
    } else if (S.status === 'won' && S.mineSet.has(i)){
      // 通关揭晓：星座星点亮为亮白 ✦，杂星只留暗灰四角星（不参与星座）
      if (S.noiseSet.has(i)){ cls += ' revealed wonoise'; svg = NOISE_STAR_SVG; }
      else { cls += ' revealed wonstar'; text = '✦'; }
    } else if (S.flagged[i]){
      cls += ' flagged';                    // 玩家标记的星
      text = '★';
    }
    if (el.className !== cls) el.className = cls;
    if (svg){
      if (el.textContent !== '') el.textContent = '';
      if (el.innerHTML !== svg) el.innerHTML = svg;
    } else {
      if (el.innerHTML !== '') el.innerHTML = '';
      if (el.textContent !== text) el.textContent = text;
    }
  }

  statusCountsEl.textContent = '已翻开 ' + revealed + '/' + S.totalSafe +
    ' · 已标记 ★ ' + marked + '/' + minesTotal;
  renderScopes();

  const teach = (typeof S.level.teach === 'string') ? S.level.teach : '';
  teachEl.textContent = teach;
  teachEl.className = teach ? 'teach' : 'teach hidden';

  nameEl.textContent = S.level.name ? (' · ' + S.level.name) : '';
  lvtagEl.textContent = '第 ' + (S.index + 1) + ' / ' + LEVELS.length + ' 关 · ' +
    S.n + '×' + S.n + (S.level.showRuns ? ' · 含行列线索' : ' · 仅邻域数字');

  digBtn.className = currentMode === MODE_DIG ? 'btn on' : 'btn';
  flagBtn.className = currentMode === MODE_FLAG ? 'btn on' : 'btn';
  digBtn.setAttribute('aria-pressed', currentMode === MODE_DIG ? 'true' : 'false');
  flagBtn.setAttribute('aria-pressed', currentMode === MODE_FLAG ? 'true' : 'false');

  refreshLevelGrid();
  renderModal();
  renderStrip();

  document.body.dataset.gameState = JSON.stringify({
    level: S.index + 1,
    levelId: (typeof S.level.id === 'number' ? S.level.id : S.index + 1),
    size: S.n,
    revealed: revealed,
    totalSafe: S.totalSafe,
    flagged: marked,
    mines: minesTotal,
    lives: S.lives,
    status: S.status,
    mode: currentMode,
    totalLevels: LEVELS.length,
    clearedLevels: clearedTotal(),
    noise: S.noiseSet.size
  });
}

// ---------- 望远镜命数 ----------
// 固定 3 个槽位（livesMax），同一架望远镜「点亮/熄灭」，读屏器只念整组的 aria-label。
// 图标用 innerHTML 拼内联 SVG（不出现命名空间字面量），跨平台观感一致。
const SCOPE_SVG = '<svg viewBox="0 0 24 24" class="scope-svg" aria-hidden="true" focusable="false">' +
  '<path class="scope-tube" d="M3.4 13.1 14.9 4.2l3.1 4.1-11.5 8.9z"></path>' +
  '<circle class="scope-lens" cx="16.9" cy="6.1" r="2.8"></circle>' +
  '<path class="scope-leg" d="M8.5 15.9 6.2 21M9.5 16.7l1.7 4.3"></path>' +
  '</svg>';

// 杂星图形：内联 SVG 四角星（小、冷灰、无光晕）——避免 ✧ 字符在部分安卓字体里变成方框
const NOISE_STAR_SVG = '<svg class="noise-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
  '<path d="M12 2.2l2.1 7.7 7.7 2.1-7.7 2.1L12 21.8l-2.1-7.7L2.2 12l7.7-2.1z"></path></svg>';

function renderScopes(){
  const max = (typeof S.livesMax === 'number' && S.livesMax > 0) ? S.livesMax : 3;
  const cur = Math.max(0, Math.min(max, S.lives));
  scopesEl.setAttribute('aria-label', '剩余命数 ' + cur + ' / ' + max);

  if (scopesEl.childNodes.length !== max){
    scopesEl.innerHTML = '';
    for (let i = 0; i < max; i++){
      const sp = document.createElement('span');
      sp.setAttribute('aria-hidden', 'true');
      sp.innerHTML = SCOPE_SVG;
      scopesEl.appendChild(sp);
    }
  }
  for (let i = 0; i < max; i++){
    const sp = scopesEl.childNodes[i];
    const cls = 'scope ' + (i < cur ? 'full' : 'empty');   // 熄灭 = 同一图标变暗，不换符号
    if (sp.className !== cls) sp.className = cls;
  }

  if (lastShownLives >= 0 && cur < lastShownLives){
    flashing = true;
    scopesEl.className = 'scopes flash';       // 轻量受击反馈
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ flashing = false; scopesEl.className = 'scopes'; }, 240);
  } else if (!flashing){
    scopesEl.className = 'scopes';
  }
  lastShownLives = cur;
}

// ---------- 结算 modal（通关 / 失败共用） ----------
function isLastLevel(){ return S.index >= LEVELS.length - 1; }

function mkBtn(label, cls, handler, disabled){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = label;
  if (disabled) b.disabled = true;
  if (handler && !disabled) b.addEventListener('click', handler);
  return b;
}

function replayLevel(){
  if (!S) return;
  const i = S.index;
  startLevel(i);
  focusBoard();
}

function nextLevel(){
  if (!S) return;
  const i = S.index;
  if (i < LEVELS.length - 1){
    startLevel(i + 1);
    focusBoard();
  } else {
    dismissModal();               // 保险：最后一关不会出现“点了没反应”的按钮
  }
}

function focusBoard(){
  const el = cellEls[0];
  if (el && el.focus){ try { el.focus(); } catch (e) {} }
}

// ---------- 通关揭晓：星座图（星点 + 连线） ----------
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ---------- 深空摄影感：视星等 / 星色 / 确定性星尘 ----------
const STAR_TINT = {
  warm:    { core:'#fff2df', glow:'#ffc98d', spike:'#ffd9ae' },
  cool:    { core:'#e8f4ff', glow:'#8fc4ff', spike:'#bcd9ff' },
  neutral: { core:'#f7faff', glow:'#c9dcff', spike:'#dbe8ff' }
};
function tintOf(st){
  return STAR_TINT[(st && (st.tint === 'warm' || st.tint === 'cool')) ? st.tint : 'neutral'];
}
// 视星等 -> 半径（越小越亮；0.13 等≈2.9，3.05 等≈1.8，6 等≈0.9）
function magToRadius(mag){
  const m = (typeof mag === 'number' && isFinite(mag)) ? Math.max(-1.5, Math.min(6, mag)) : 3;
  return 0.9 + 2.6 * Math.pow((6 - m) / 7.5, 1.1);
}
// 确定性伪随机（FNV-1a + LCG）：同一 theme.id 星尘完全一致
function seedFrom(s){
  let h = 2166136261; s = String(s == null ? '' : s);
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  let s = seed >>> 0;
  return function(){ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}
function dustHtml(theme){
  const rnd = rngFrom(seedFrom(theme && theme.id ? theme.id : 'sky'));
  let out = '';
  for (let i = 0; i < 30; i++){
    out += '<circle class="gdust" cx="' + (3 + rnd() * 94).toFixed(1) + '" cy="' + (3 + rnd() * 94).toFixed(1) +
      '" r="' + (0.25 + rnd() * 0.25).toFixed(2) + '" opacity="' + (0.1 + rnd() * 0.4).toFixed(2) + '"></circle>';
  }
  return out;
}
// 把 theme.stars 的格子坐标 [r,c] 映射到 0..100 的 viewBox
function constSvg(theme, n, noise){
  const stars = (theme && Array.isArray(theme.stars)) ? theme.stars : [];
  const lines = (theme && Array.isArray(theme.lines)) ? theme.lines : [];
  const size = n > 0 ? n : 1, pad = 8, span = 84;
  const at = function(rc){
    const r = rc && rc.length > 1 ? Number(rc[0]) || 0 : 0, c = rc && rc.length > 1 ? Number(rc[1]) || 0 : 0;
    return [ (pad + (c + 0.5) / size * span).toFixed(1), (pad + (r + 0.5) / size * span).toFixed(1) ];
  };
  let linesHtml = '';
  for (let i = 0; i < lines.length; i++){
    const seg = lines[i], a = seg && stars[seg[0]], b = seg && stars[seg[1]];
    if (!a || !b) continue;
    const p = at(a.rc), q = at(b.rc);
    const g = ' x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '"';
    linesHtml += '<line class="gline-glow"' + g + '></line><line class="gline"' + g +
      ' style="animation-delay:' + (0.04 + i * 0.045).toFixed(2) + 's"></line>';
  }
  let starsHtml = '';
  for (let i = 0; i < stars.length; i++){
    const st = stars[i] || {}, p = at(st.rc), tc = tintOf(st);
    const mag = (typeof st.mag === 'number' && isFinite(st.mag)) ? st.mag : 3;
    const r = magToRadius(mag), d = (0.03 + i * 0.03).toFixed(2) + 's';
    const x = p[0], y = p[1];
    const label = escHtml(st.name || '') + (st.en ? ' ' + escHtml(st.en) : '') + ' · ' + mag + ' 等';
    let spike = '';
    if (mag <= 2.5){
      const L = r * 3, op = r >= 2.6 ? 0.5 : 0.34;
      spike = '<g class="gspike" stroke="' + tc.spike + '" stroke-opacity="' + op +
        '" stroke-width=".45" stroke-linecap="round" style="animation-delay:' + d + '">' +
        '<line x1="' + (x - L).toFixed(2) + '" y1="' + y + '" x2="' + (+x + L).toFixed(2) + '" y2="' + y + '"></line>' +
        '<line x1="' + x + '" y1="' + (y - L).toFixed(2) + '" x2="' + x + '" y2="' + (+y + L).toFixed(2) + '"></line></g>';
    }
    starsHtml += '<circle class="ghalo" cx="' + x + '" cy="' + y + '" r="' + (r * 3.4).toFixed(2) +
      '" fill="' + tc.glow + '" fill-opacity=".14" style="animation-delay:' + d + '"></circle>' +
      '<circle class="ghalo2" cx="' + x + '" cy="' + y + '" r="' + (r * 1.9).toFixed(2) +
      '" fill="' + tc.glow + '" fill-opacity=".26" style="animation-delay:' + d + '"></circle>' + spike +
      '<circle class="gstar" cx="' + x + '" cy="' + y + '" r="' + r.toFixed(2) + '" fill="' + tc.core +
      '" style="animation-delay:' + d + '"><title>' + label + '</title></circle>';
  }
  // 杂星：冷灰小暗点，先亮一下再淡出 —— 让玩家看清"这些灰点不属于星座、不参与连线"
  let noiseHtml = '';
  const nz = Array.isArray(noise) ? noise : [];
  const starSet = new Set(stars.map(x => String(x && x.rc && x.rc[0]) + ',' + String(x && x.rc && x.rc[1])));
  for (let k = 0; k < nz.length; k++){
    const rc = nz[k];
    if (!rc || rc.length < 2) continue;
    if (starSet.has(String(rc[0]) + ',' + String(rc[1]))) continue;   // 与星座星重叠的跳过
    const p2 = at(rc);
    noiseHtml += '<circle class="gnoise" cx="' + p2[0] + '" cy="' + p2[1] + '" r="1.15" ' +
      'style="animation-delay:' + (0.05 + k * 0.02).toFixed(2) + 's"></circle>';
  }
  return '<svg class="const-svg" viewBox="0 0 100 100" role="img" aria-label="' + escHtml(theme.name || '') +
    ' 星座星图">' + dustHtml(theme) + noiseHtml + linesHtml + starsHtml + '</svg>';
}

function buildConstPanel(theme, n, noise){
  const panel = document.createElement('div');
  panel.className = 'const-panel';
  panel.setAttribute('data-constellation', String(theme.id || ''));

  const name = document.createElement('div');
  name.className = 'const-name';
  name.textContent = theme.name || '';
  if (theme.nameEn){
    const en = document.createElement('span');
    en.textContent = theme.nameEn;
    name.appendChild(en);
  }
  panel.appendChild(name);

  const map = document.createElement('div');
  map.className = 'const-map';
  map.innerHTML = constSvg(theme, n, noise);   // 用 innerHTML 建内联 SVG（无命名空间字面量）
  panel.appendChild(map);

  if (theme.fact){
    const fact = document.createElement('p');
    fact.className = 'const-fact';
    fact.textContent = theme.fact;
    panel.appendChild(fact);
  }
  const tag = document.createElement('div');
  tag.className = 'const-tag';
  tag.textContent = '✦ 星座图鉴 +1';
  panel.appendChild(tag);
  return panel;
}

function buildModal(){
  const won = S.status === 'won';
  const last = won && isLastLevel();
  modalEl.className = 'modal ' + (won ? 'win' : 'lose');
  if (won){
    modalTitleEl.textContent = last ? '全部通关！' : '第 ' + (S.index + 1) + ' 关 · 通关！';
    modalSubEl.textContent = last
      ? '所有 ' + LEVELS.length + ' 关观测完成，可从右上角「关卡」面板重玩任意关。'
      : '观测完成：所有安全格已翻开、全部星星已标记。';
  } else {
    modalTitleEl.textContent = '观测失败';
    modalSubEl.textContent = S.lastHitNoise
      ? '踩到了背景里的杂星（它不属于这个星座），命数耗尽。可以重来，或换个关卡。'
      : '踩掉了一颗还没标记的星星，命数耗尽。可以重来，或换个关卡。';
  }

  // 通关揭晓区：只有本关带 theme 才渲染（老数据自动省略，向后兼容）
  if (constSlotEl) constSlotEl.innerHTML = '';
  const theme = (won && S.level && S.level.theme) ? S.level.theme : null;
  if (theme && Array.isArray(theme.stars) && theme.stars.length && constSlotEl){
    constSlotEl.appendChild(buildConstPanel(theme, S.n, S.level.noise));
  }

  modalBtnsEl.innerHTML = '';
  modalPrimaryBtn = null;

  if (won && !last){
    modalBtnsEl.appendChild(mkBtn('↻ 重来本关', 'btn again', replayLevel));
    modalPrimaryBtn = mkBtn('下一关 →', 'btn primary', nextLevel);
    modalBtnsEl.appendChild(modalPrimaryBtn);
  } else if (won && last){
    modalPrimaryBtn = mkBtn('↻ 重来本关', 'btn primary', replayLevel);
    modalBtnsEl.appendChild(modalPrimaryBtn);
    // 最后一关：“下一关”位置改成禁用的「全部通关」，不是死按钮
    modalBtnsEl.appendChild(mkBtn('全部通关', 'btn', null, true));
  } else {
    modalPrimaryBtn = mkBtn('↻ 重来本关', 'btn primary', replayLevel);
    modalBtnsEl.appendChild(modalPrimaryBtn);
    modalBtnsEl.appendChild(mkBtn('换个关卡', 'btn again', function(){ dismissModal(); openPanel(); }));
  }
}

function renderModal(){
  // 通关闪烁播放期间先不弹窗，让玩家看清星座
  if (winFlashPending){ closeModal(false); return; }
  const result = (S.status === 'won' || S.status === 'lost');
  if (!result || modalDismissed){ closeModal(false); return; }
  const sig = S.status + '|' + S.index + '|' + LEVELS.length;
  if (modalSignature !== sig){ modalSignature = sig; buildModal(); }
  if (!modalOpenNow){
    modalOpenNow = true;
    overlayEl.className = 'overlay open';
    overlayEl.setAttribute('aria-hidden', 'false');
    lastFocusEl = document.activeElement || null;
    const target = modalPrimaryBtn || modalEl;
    if (target && target.focus){ try { target.focus(); } catch (e) {} }
  }
}

function closeModal(restoreFocus){
  if (!modalOpenNow){
    overlayEl.className = 'overlay';
    overlayEl.setAttribute('aria-hidden', 'true');
    return;
  }
  modalOpenNow = false;
  modalSignature = '';
  overlayEl.className = 'overlay';
  overlayEl.setAttribute('aria-hidden', 'true');
  if (restoreFocus && lastFocusEl && lastFocusEl.focus){
    try { lastFocusEl.focus(); } catch (e) {}
  }
  lastFocusEl = null;
}

function dismissModal(){
  if (!modalOpenNow) return;
  modalDismissed = true;
  closeModal(true);
  render();          // 结算条接替 modal，保留「下一关 / 重来」入口
}

// 底部结算条：仅在 modal 被 Esc/遮罩收起后出现，避免“关了就没入口”
function renderStrip(){
  const result = (S.status === 'won' || S.status === 'lost');
  if (!result || modalOpenNow || !modalDismissed){
    resultEl.className = 'result';
    resultEl.innerHTML = '';
    return;
  }
  const won = S.status === 'won';
  const last = won && isLastLevel();
  resultEl.className = 'result show ' + (won ? 'win' : 'lose');
  resultEl.innerHTML = '';

  const p = document.createElement('div');
  p.className = 'msg';
  p.textContent = won ? (last ? '🎉 全部通关！' : '✅ 本关已通关') : '❌ 观测失败 · 命数耗尽';
  resultEl.appendChild(p);

  const row = document.createElement('div');
  row.className = 'result-btns';
  if (won && !last) row.appendChild(mkBtn('下一关 →', 'btn primary', nextLevel));
  row.appendChild(mkBtn('↻ 重来本关', 'btn again', replayLevel));
  if (!won || last) row.appendChild(mkBtn('换个关卡', 'btn ghost', openPanel));
  row.appendChild(mkBtn('结算', 'btn ghost', function(){ modalDismissed = false; render(); }));
  resultEl.appendChild(row);
}

function buildLevelGrid(){
  lvGrid.innerHTML = '';
  lvlEls = [];
  for (let i = 0; i < LEVELS.length; i++){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lvl';
    b.textContent = String(i + 1);                 // 关卡号
    b.setAttribute('data-level', String(i + 1));

}

// 三态：已通关 / 当前（解锁但未通关）/ 未解锁；另用 playing 标出正在玩的关卡
function refreshLevelGrid(){
  const f = frontier();
  for (let i = 0; i < lvlEls.length; i++){
    const b = lvlEls[i];
    const cleared = isCleared(i);
    const unlocked = progress.devUnlock === true || i <= f;
    const playing = !!S && S.index === i;
    let cls = 'lvl';
    let label = '第 ' + (i + 1) + ' 关';
    if (cleared){ cls += ' cleared'; label += '，已通关'; }
    else if (!unlocked){ cls += ' locked'; label += '，未解锁'; }
    else if (i === f && progress.devUnlock !== true){ cls += ' current'; label += '，当前关卡'; }
    if (playing) cls += ' playing';
    if (b.className !== cls) b.className = cls;
    b.disabled = !(unlocked || cleared);
    b.setAttribute('aria-label', label);
    b.setAttribute('aria-current', playing ? 'true' : 'false');
  }
  lvBtnNum.textContent = String((S ? S.index : 0) + 1);
  lvBtnTotal.textContent = String(LEVELS.length);
  totalCountEl.textContent = String(LEVELS.length);
  clearedCountEl.textContent = String(clearedTotal());
}

// ===== 星座图鉴（天球投影）：横轴赤经 0–24h，纵轴赤纬 +90° → −90° =====
const skyEls = {
  btn: document.getElementById('skyBtn'),
  btnNum: document.getElementById('skyBtnNum'),
  btnTotal: document.getElementById('skyBtnTotal'),
  panel: document.getElementById('skyPanel'),
  close: document.getElementById('skyCloseBtn'),
  map: document.getElementById('skyMap'),
  detail: document.getElementById('skyDetail'),
  filters: document.getElementById('skyFilters'),
  count: document.getElementById('skyCount'),
  total: document.getElementById('skyTotal')
};
let skyFilter = '全部';
let skySelected = null;
let skyOpen = false;

function skyIsOn(s){ return isCleared(s.level - 1); }
function skyOnCount(){ return SKY.filter(skyIsOn).length; }
function skyProj(ra, dec){
  return [ 8 + (1 - ra / 24) * 184, 8 + (90 - dec) / 180 * 104 ];
}
function skyEsc(t){
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function skyX(ra){ return 8 + (1 - ra / 24) * 184; }
function skyY(dec){ return 8 + (90 - dec) / 180 * 104; }
// 季节 -> 赤经板块（1 时 = 15°，一晚中天的范围约 6 小时）
const SKY_BANDS = {
  '春季': [[9, 15]],
  '夏季': [[15, 21]],
  '秋季': [[21, 24], [0, 3]],
  '冬季': [[3, 9]]
};
// 视图：translate(x,y) 之后 scale(s)，单位都是 viewBox 单位
let skyView = { s: 1, x: 0, y: 0 };
const skyPointers = new Map();
let skyPinch = null;
let skyDownPt = null, skyMoved = false;

function skyTransform(){
  return 'translate(' + skyView.x.toFixed(2) + ',' + skyView.y.toFixed(2) + ') scale(' + skyView.s.toFixed(3) + ')';
}
function skyApplyView(){
  const root = skyEls.map && skyEls.map.querySelector('.sky-root');
  if (root) root.setAttribute('transform', skyTransform());
}
function skyClampView(){
  skyView.s = Math.max(0.7, Math.min(4, skyView.s));
  const mx = 110 + 200 * (skyView.s - 1) / 2;
  const my = 50 + 120 * (skyView.s - 1) / 2;
  skyView.x = Math.max(-mx, Math.min(mx, skyView.x));
  skyView.y = Math.max(-my, Math.min(my, skyView.y));
}
// 以 viewBox 坐标 (cx,cy) 为锚点缩放
function skyZoomAt(factor, cx, cy){
  const old = skyView.s;
  const ns = Math.max(0.7, Math.min(4, old * factor));
  const k = ns / old;
  skyView.x = cx - (cx - skyView.x) * k;
  skyView.y = cy - (cy - skyView.y) * k;
  skyView.s = ns;
  skyClampView();
  skyApplyView();
}
function skyAnimateTo(target){
  const reduce = (typeof window.matchMedia === 'function') &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || typeof requestAnimationFrame !== 'function'){
    skyView = { s: target.s, x: target.x, y: target.y };
    skyApplyView(); return;
  }
  const from = { s: skyView.s, x: skyView.x, y: skyView.y };
  const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const dur = 420;
  function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    skyView.s = from.s + (target.s - from.s) * e;
    skyView.x = from.x + (target.x - from.x) * e;
    skyView.y = from.y + (target.y - from.y) * e;
    skyApplyView();
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // 兜底：某些环境（无头/后台标签）rAF 会被节流，到点强制落到终态
  setTimeout(function(){ skyView = { s: target.s, x: target.x, y: target.y }; skyApplyView(); }, dur + 80);
}
// 聚焦到某个季节的赤经板块（放大 + 居中）
function skyFocusBands(bands){
  if (!bands || bands.length !== 1){
    skyAnimateTo({ s: 1, x: 0, y: 0 });
    return;
  }
  const b = bands[0];
  const xa = skyX(b[0]), xb = skyX(b[1]);
  const left = Math.min(xa, xb), right = Math.max(xa, xb);
  // 适度放大：既“聚焦板块”，又保留足够赤纬范围（用户可用滚轮/双指继续放大）
  const ns = 1.35;
  const cx = (left + right) / 2;
  skyAnimateTo({ s: ns, x: 100 - cx * ns, y: 60 - 60 * ns });
}

function renderSkyMap(){
  if (!skyEls.map) return;
  const defs = '<defs>' +
    '<radialGradient id="skyMw" cx="50%" cy="50%" r="62%">' +
      '<stop offset="0%" stop-color="#41609c" stop-opacity=".26"></stop>' +
      '<stop offset="70%" stop-color="#2a3f70" stop-opacity=".12"></stop>' +
      '<stop offset="100%" stop-color="#0a1024" stop-opacity="0"></stop>' +
    '</radialGradient>' +
    '<radialGradient id="skyVig" cx="50%" cy="45%" r="70%">' +
      '<stop offset="60%" stop-color="#000" stop-opacity="0"></stop>' +
      '<stop offset="100%" stop-color="#000" stop-opacity=".55"></stop>' +
    '</radialGradient>' +
  '</defs>';

  // 确定性星尘（同一张图每次一致）
  let dust = '', seed = 20261022;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (let i = 0; i < 80; i++){
    dust += '<circle cx="' + (rnd() * 200).toFixed(1) + '" cy="' + (rnd() * 120).toFixed(1) +
      '" r="' + (0.25 + rnd() * 0.7).toFixed(2) + '" fill="#cfe0ff" opacity="' +
      (0.12 + rnd() * 0.45).toFixed(2) + '"></circle>';
  }
  // 银河带
  const mw = '<ellipse cx="100" cy="60" rx="160" ry="26" fill="url(#skyMw)" transform="rotate(-16 100 60)"></ellipse>';

  // 季节板块
  let sector = '';
  const bands = (skyFilter !== '全部') ? (SKY_BANDS[skyFilter] || []) : [];
  for (let i = 0; i < bands.length; i++){
    const b = bands[i];
    const xa = skyX(b[1]), xb = skyX(b[0]);
    sector += '<rect class="sky-sector" x="' + Math.min(xa, xb).toFixed(1) + '" y="6" width="' +
      Math.abs(xa - xb).toFixed(1) + '" height="104" rx="4"></rect>';
  }

  // 网格：赤纬
  let grid = '';
  for (let dec = -60; dec <= 60; dec += 30){
    const y = skyY(dec).toFixed(1);
    grid += '<line class="sky-grid' + (dec === 0 ? ' sky-grid-eq' : '') + '" x1="8" y1="' + y +
      '" x2="192" y2="' + y + '"></line>';
    grid += '<text class="sky-lbl" x="4" y="' + (+y + 1) + '" text-anchor="middle">' +
      (dec > 0 ? '+' : '') + dec + '°</text>';
  }
  // 网格：赤经
  for (let ra = 0; ra <= 24; ra += 3){
    const x = skyX(ra).toFixed(1);
    grid += '<line class="sky-grid" x1="' + x + '" y1="8" x2="' + x + '" y2="112"></line>';
    if (ra % 6 === 0){
      grid += '<text class="sky-lbl" x="' + x + '" y="117" text-anchor="middle">' + ra + 'h</text>';
    }
  }

  // 星座节点
  let nodes = '';
  for (let i = 0; i < SKY.length; i++){
    const s = SKY[i];
    const on = skyIsOn(s);
    const inSeason = (skyFilter === '全部') || (s.season === skyFilter);
    if (!inSeason) continue;                    // 非当季：直接不显示（“只在全部和夏季出现”）
    const p = [skyX(s.ra), skyY(s.dec)];
    const sel = (skySelected === s.id) ? ' sel' : '';
    const cls = 'skynode' + (on ? ' on' : '') + sel;
    const r = on ? 1.9 : 1.1;
    nodes += '<g class="' + cls + '" data-sky="' + skyEsc(s.id) + '" role="button" tabindex="0" ' +
      'aria-label="' + skyEsc(s.zh) + (on ? '，已观测' : '，未观测') + '">' +
      '<circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5"></circle>';
    if (on){
      nodes += '<circle class="halo" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (r * 2.6).toFixed(1) + '"></circle>';
    }
    nodes += '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '"></circle>';
    if (on){
      const ly = (p[1] + (s.dec >= 20 ? -4.2 : 5.6)).toFixed(1);
      nodes += '<text class="lbl" x="' + p[0].toFixed(1) + '" y="' + ly + '">' + skyEsc(s.zh.replace('座', '')) + '</text>';
    } else {
      nodes += '<text class="qlbl" x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4.6).toFixed(1) + '">?</text>';
    }
    nodes += '</g>';
  }

  skyEls.map.innerHTML = defs +
    '<g class="sky-root" transform="' + skyTransform() + '">' +
      mw + dust + sector + grid + nodes +
    '</g>' +
    '<rect class="sky-vignette" x="0" y="0" width="200" height="120" fill="url(#skyVig)" pointer-events="none"></rect>';
}

function renderSkyFilters(){
  if (!skyEls.filters) return;
  const opts = ['全部', '春季', '夏季', '秋季', '冬季'];
  skyEls.filters.innerHTML = opts.map(function(o){
    return '<button type="button" class="mini' + (skyFilter === o ? ' on' : '') +
      '" data-season="' + o + '" aria-pressed="' + (skyFilter === o) + '">' + o + '</button>';
  }).join('');

function renderSkyDetail(){
  if (!skyEls.detail) return;
  if (!skySelected){
    skyEls.detail.innerHTML = '<div class="sky-card"><h3>观测你的星空</h3>' +
      '<p class="sky-locked">每通过一关，图鉴上就会点亮一颗星座。<br>' +
      '横轴是赤经（0–24 时），纵轴是赤纬（+90° 北天极 → −90° 南天极）；' +
      '左边/右边就是真实夜空里相邻的方向。<br>点任意一颗（或按季节筛选）看详情。</p></div>';
    return;

  const s = SKY.find(function(x){ return x.id === skySelected; });

      '<div class="sub">第 ' + s.level + ' 关 · 通关后点亮</div>' +

  }).join('');
  const starMap = (lv && lv.theme) ? constSvg(lv.theme, lv.size, lv.noise) : '';
  skyEls.detail.innerHTML =
    '<div class="sky-card">' +
      '<h3>' + skyEsc(s.zh) + ' <span class="sub">' + skyEsc(s.en) + ' · ' + skyEsc(s.abbr) + '</span></h3>' +
      '<div class="sub">第 ' + s.level + ' 关 · 已观测</div>' +
      '<dl class="sky-meta">' +
        '<dt>中心坐标</dt><dd>赤经 ' + s.raText + '，赤纬 ' + s.decText + '</dd>' +
        '<dt>天区</dt><dd>' + s.zone + ' · ' + s.season + '星空</dd>' +
        '<dt>面积</dt><dd>全天第 ' + s.areaRank + ' 大</dd>' +
        '<dt>最亮星</dt><dd>' + skyEsc(s.brightest.zh) + '（' + skyEsc(s.brightest.en) +
          '，' + s.brightest.mag + ' 等）</dd>' +
      '</dl>' +
      '<div class="sky-map-slot">' + starMap + '</div>' +
      ((lv && lv.theme && lv.theme.fact) ? '<p class="sky-fact">' + skyEsc(lv.theme.fact) + '</p>' : '') +
      '<div class="sky-neigh">' + nb + '</div>' +
    '</div>';
}

// 按住拖动 = 平移；滚轮 / 双指 = 缩放；单击（位移 < 8px）= 选中
if (skyEls.map){
  function vbox(e){
    const rect = skyEls.map.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) / Math.max(1, rect.width) * 200,
      y: (e.clientY - rect.top) / Math.max(1, rect.height) * 120,
      sx: 200 / Math.max(1, rect.width),
      sy: 120 / Math.max(1, rect.height),
      rect: rect
    };
  }
  skyEls.map.addEventListener('pointerdown', function(e){
    skyPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { skyEls.map.setPointerCapture(e.pointerId); } catch (_) {}
    if (skyPointers.size === 1){
      skyDownPt = { x: e.clientX, y: e.clientY };
      skyMoved = false;
      skyDragLast = { x: e.clientX, y: e.clientY };
    } else if (skyPointers.size === 2){
      const pts = Array.from(skyPointers.values());
      skyPinch = {
        d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        mid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 },
        view: { s: skyView.s, x: skyView.x, y: skyView.y }
      };
      skyMoved = true;
    }
    skyEls.map.classList.add('dragging');
  });

  skyEls.map.addEventListener('pointermove', function(e){
    if (!skyPointers.has(e.pointerId)) return;
    skyPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (skyPointers.size >= 2 && skyPinch){
      const pts = Array.from(skyPointers.values()).slice(0, 2);
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      const factor = d / Math.max(1, skyPinch.d);
      // 从捏合起始状态重新计算，避免累计误差
      skyView = { s: skyPinch.view.s, x: skyPinch.view.x, y: skyPinch.view.y };
      const v0 = vbox({ clientX: skyPinch.mid.x, clientY: skyPinch.mid.y });
      const v1 = vbox({ clientX: mid.x, clientY: mid.y });
      skyZoomAt(factor, v0.x, v0.y);
      skyView.x += (v1.x - v0.x);
      skyView.y += (v1.y - v0.y);
      skyClampView(); skyApplyView();
      e.preventDefault();
      return;
    }

    if (skyPointers.size === 1 && skyDownPt){
      if (Math.hypot(e.clientX - skyDownPt.x, e.clientY - skyDownPt.y) > 8) skyMoved = true;
      if (skyMoved){
        const scale = 200 / Math.max(1, skyEls.map.getBoundingClientRect().width);
        skyView.x += (e.clientX - skyDragLast.x) * scale;
        skyView.y += (e.clientY - skyDragLast.y) * (120 / Math.max(1, skyEls.map.getBoundingClientRect().height));
        skyDragLast = { x: e.clientX, y: e.clientY };
        skyClampView(); skyApplyView();
        e.preventDefault();
      }
    }
  });

  function skyPointerEnd(e){
    skyPointers.delete(e.pointerId);
    if (skyPointers.size < 2) skyPinch = null;
    if (skyPointers.size === 0){
      skyEls.map.classList.remove('dragging');
    }
  }
  skyEls.map.addEventListener('pointerup', skyPointerEnd);
  skyEls.map.addEventListener('pointercancel', skyPointerEnd);

  skyEls.map.addEventListener('wheel', function(e){
    e.preventDefault();
    const v = vbox(e);
    skyZoomAt(Math.exp(-e.deltaY * 0.0016), v.x, v.y);
  }, { passive: false });

  skyEls.map.addEventListener('dblclick', function(){
    skyAnimateTo({ s: 1, x: 0, y: 0 });
  });
}

let skyDragLast = { x: 0, y: 0 };
if (skyEls.detail) skyEls.detail.addEventListener('click', function(e){
  const b = e.target.closest('[data-jump]');
  if (!b) return;
  skySelected = b.getAttribute('data-jump');
  renderSky();
});

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape' || e.key === 'Esc'){
    if (modalOpenNow){ dismissModal(); return; }   // Esc 收起结算，结算条保留入口
    if (skyOpen){ closeSky(); return; }
    if (panelOpen) closePanel();
  }
});

if (Array.isArray(LEVELS) && LEVELS.length){
  loadProgress();
  buildLevelGrid();
  refreshUnlockBtn();
  refreshSkyBadge();
  startLevel(startIndex());
} else {
  boardEl.innerHTML = '<p class="err">关卡数据缺失。</p>';
}
})();
</script>
</body>
